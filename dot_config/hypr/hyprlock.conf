# hyprlock — обои из текущей ротации + палитра pywal (переменные рендерит rice-render)
source = ~/.cache/rice/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, out
    animation = fadeOut, 1, 3, out
    animation = inputFieldDots, 1, 2, out
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.1
}

# крупные часы
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $fg
    font_size = 132
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000099)
}

# дата
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d.%m.%Y"
    color = $accent
    font_size = 22
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

# пароль
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent_a
    inner_color = $bg_a
    font_color = $fg
    font_family = $font
    check_color = $warn
    fail_color = $urgent
    capslock_color = $warn
    fade_on_empty = false
    placeholder_text = <i>$USER</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}

# раскладка
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -115
    halign = center
    valign = center
}
