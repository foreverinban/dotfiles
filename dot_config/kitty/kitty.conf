shell zsh
font_family      JetBrainsMono Nerd Font
font_size        11.0
confirm_os_window_close 0
window_padding_width 6

# палитра pywal (16 цветов, фон/текст)
include ~/.cache/wal/colors-kitty.conf
# единый rice: прозрачность = waybar/wofi (rice.conf OPACITY), tab bar в accent.
# Подключается ПОСЛЕ wal, чтобы перебить его background_opacity 1.0.
include ~/.cache/rice/kitty.conf
dynamic_background_opacity yes

# tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        2
tab_title_template      " {index}: {title[:24]} "
active_tab_font_style   bold
inactive_tab_font_style normal
