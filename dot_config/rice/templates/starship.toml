# generated by rice-render — STARSHIP_CONFIG указывает сюда (см. ~/.zshrc_custom)
# цвета сегментов = единая палитра: accent {{accent}}, bg_alt2 {{bg_alt2}}, muted {{muted}}
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 800

format = """
[](fg:{{accent}})\
$username$hostname\
[](fg:{{accent}} bg:{{bg_alt2}})\
$directory\
[](fg:{{bg_alt2}} bg:{{bg_alt}})\
$git_branch$git_status\
[](fg:{{bg_alt}})\
$python$nodejs$rust$golang\
$cmd_duration\
$fill\
$status$time
$character"""

[username]
show_always = true
style_user = "fg:{{bg}} bg:{{accent}} bold"
style_root = "fg:{{urgent}} bg:{{accent}} bold"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "fg:{{bg}} bg:{{accent}}"
format = "[@$hostname]($style)"

[directory]
style = "fg:{{fg}} bg:{{bg_alt2}}"
read_only_style = "fg:{{urgent}} bg:{{bg_alt2}}"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:{{accent}} bg:{{bg_alt}}"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:{{warn}} bg:{{bg_alt}}"
format = "[($all_status$ahead_behind )]($style)"

[python]
style = "fg:{{fg_dim}}"
format = " [py $version( \\($virtualenv\\))]($style)"

[nodejs]
style = "fg:{{fg_dim}}"
format = " [node $version]($style)"

[rust]
style = "fg:{{fg_dim}}"
format = " [rs $version]($style)"

[golang]
style = "fg:{{fg_dim}}"
format = " [go $version]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{muted}}"
format = " [took $duration]($style)"

[fill]
symbol = " "

[status]
disabled = false
style = "fg:{{urgent}}"
format = "[✗ $status]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{muted}}"
format = "[$time]($style)"

[character]
success_symbol = "[❯](fg:{{accent}})"
error_symbol = "[❯](fg:{{urgent}})"
vimcmd_symbol = "[❮](fg:{{ok}})"
