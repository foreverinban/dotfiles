# ─── rice.conf — единая точка настройки визуального стиля ───────────────
# Читается rice-apply / rice-render / wallpaper-watcher / waybar-скриптами.
# Формат: shell KEY=VALUE (source-ится из bash).

# Пул обоев для ротации (все файлы/симлинки в каталоге)
POOL_DIR="$HOME/Pictures/Wallpapers/pool"

# Ротация: интервал в секундах (86400 = раз в сутки) и смена при логине
ROTATE_INTERVAL=86400
ROTATE_ON_LOGIN=1

# ЕДИНЫЙ АКЦЕНТ: слот палитры pywal (color1..color15).
# Все конфиги (рамка окна, workspace, батарея, wofi, hyprlock, kitty tabs,
# starship, swaync, lualine, SDDM, курсор) берут цвет ТОЛЬКО отсюда.
ACCENT_SLOT=color4
# Минимальный контраст акцента к фону (WCAG); если ниже — акцент осветляется
ACCENT_MIN_CONTRAST=3.0

# Единая прозрачность: waybar, wofi, kitty, swaync, wlogout
OPACITY=0.86

# Погода: город для wttr.in (пусто = по IP; через VPN будет не тот город)
WEATHER_LOC=""

# Magic-ноды для waybar custom/uptime (пусто = все Host из ~/.ssh/config)
MAGIC_HOSTS=""
